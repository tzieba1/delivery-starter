[package]
name = "todo-tracker"
version = "1.0.0"
edition = "2021"
description = "Smart TODO/FIXME tracker for codebases"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
md-5 = "0.10"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
