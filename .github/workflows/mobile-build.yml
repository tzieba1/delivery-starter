name: Mobile Build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # Expo SDK 54 requires Node 20+
          cache: npm
          cache-dependency-path: services/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install
        working-directory: services/mobile
        run: npm ci
      - name: Type check
        working-directory: services/mobile
        run: npm run type-check
      - name: Lint
        working-directory: services/mobile
        run: npm run lint
      - name: Test
        working-directory: services/mobile
        run: npm test
      - name: Build
        working-directory: services/mobile
        run: |
          eas build --platform all \
                    --profile ${{ github.event.inputs.profile }} \
                    --non-interactive --no-wait
