name: Backend CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # version.py derives the version from git describe
      - name: Build development image
        run: |
          docker compose -f infrastructure/docker-compose.yml \
                         -f infrastructure/docker-compose.dev.yml build backend
      - name: Run tests
        run: |
          docker compose -f infrastructure/docker-compose.yml \
                         -f infrastructure/docker-compose.dev.yml run --rm backend pytest
      - name: Tear down
        if: always()
        run: |
          docker compose -f infrastructure/docker-compose.yml \
                         -f infrastructure/docker-compose.dev.yml down -v
