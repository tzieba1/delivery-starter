[pytest]
# Pytest Configuration for Delivery Backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for API endpoints
    slow: Tests that take a long time to run

# Minimum coverage threshold (optional - can adjust or remove)
# [coverage:report]
# fail_under = 80
