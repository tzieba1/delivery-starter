version: '3.9'
services:
  backend:
    build:
      target: development
    volumes:
      - ../services/backend/src:/app/src:ro
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
  postgres:
    ports:
      - "5432:5432"
